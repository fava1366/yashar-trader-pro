plugins { id 'com.android.application' }
android {
  namespace 'com.fava.marketpattern'
  compileSdk 35
  defaultConfig {
    applicationId 'com.fava.marketpattern'
    minSdk 23
    targetSdk 34
    versionCode 8
    versionName '1.8'
  }
  buildTypes {
    release {
      minifyEnabled false
    }
    debug {
      minifyEnabled false
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
